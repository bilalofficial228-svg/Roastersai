<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>RoastersAI — Get Roasted by AI 🔥</title>
    <meta name="description" content="Free AI roast generator in 9 languages. Hindi, English, Arabic, Spanish and more. Get savage roasts instantly!" />
    <meta property="og:title" content="RoastersAI — Get Roasted by AI 🔥" />
    <meta property="og:description" content="Free AI roast generator in Hindi, Hinglish and English. Get savage roasts instantly. Don't take it personally 😂" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0A0A0F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply saved theme before paint to prevent flash.
      (function () {
        try {
          var t = localStorage.getItem('roastify:theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
