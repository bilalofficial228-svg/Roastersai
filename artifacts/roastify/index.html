<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>AI Roast Generator – Funny & Savage Roasts Online</title>
    <meta name="description" content="Type anything and get a savage, funny AI roast instantly. The chaotic-good AI comedian for the internet." />
    <meta property="og:title" content="AI Roast Generator – Funny & Savage Roasts Online" />
    <meta property="og:description" content="Type anything and get a savage, funny AI roast instantly." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var url = new URL(window.location.href);
          var qp = url.searchParams.get('theme');
          var stored = window.localStorage.getItem('roastify:theme');
          var theme;
          if (qp === 'light' || qp === 'dark') {
            theme = qp;
            window.localStorage.setItem('roastify:theme', theme);
          } else if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            theme = 'dark';
          }
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
