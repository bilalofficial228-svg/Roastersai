<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>RoastersAI — Get Roasted by AI 🔥</title>
    <meta name="description" content="RoastersAI - Free AI roast generator in 7 languages. Get savage, funny personalized roasts instantly in English, Hindi, Spanish, French, German, Portuguese and Roman Urdu. Don't take it personally 😂" />
    <meta property="og:title" content="RoastersAI - Get Roasted by AI 🔥" />
    <meta property="og:description" content="Free savage AI roast generator. Personalized roasts in 7 languages. Try now at roastersai.com" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roastersai.com" />
    <link rel="canonical" href="https://roastersai.com" />
    <meta name="theme-color" content="#0A0A0F" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply saved theme before paint to prevent flash.
      (function () {
        try {
          var t = localStorage.getItem('roastify:theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
